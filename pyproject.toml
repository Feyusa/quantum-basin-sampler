[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-basin-sampler"
version = "0.1.0"
description = "Neutral-atom quantum/classical basin-sampling benchmarks for frustrated Ising landscapes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pulser>=1.8,<2",
  "pulser-simulation>=1.8,<2",
  "scipy>=1.11",
]

[project.optional-dependencies]
qaptiva = [
  "myqlm>=1.13,<2",
  "pulser-myqlm>=0.8,<1",
]
qadence = [
  "qadence==1.11.5",
]

[project.scripts]
qbasin = "qbasin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
